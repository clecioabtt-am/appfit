<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090c" />
  <meta name="description" content="AFIT Treinos Personalizados — consultoria, treinos e dietas em um só lugar." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AFIT" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>AFIT Treinos Personalizados</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <button class="brand" data-route="home" aria-label="Ir para o início">
        <img src="assets/images/afit-logo.jpg" alt="AFIT Treinos Personalizados" />
      </button>
      <nav class="side-nav">
        <button class="nav-item active" data-route="home"><span>⌂</span><b>Início</b></button>
        <button class="nav-item" data-route="workouts"><span>◫</span><b>Treinos</b></button>
        <button class="nav-item" data-route="diet"><span>♨</span><b>Dietas</b></button>
        <button class="nav-item" data-route="tips"><span>✦</span><b>Dicas</b></button>
        <button class="nav-item" data-route="consulting"><span>◉</span><b>Consultoria</b></button>
        <button class="nav-item" data-route="profile"><span>◎</span><b>Perfil</b></button>
      </nav>
      <button id="installSidebar" class="install-compact hidden">＋ Instalar app</button>
      <div class="coach-card">
        <div class="coach-avatar"><img src="assets/images/personal-afit.jpg" alt="Personal AFIT" /></div>
        <div><small>Seu personal</small><strong>Equipe AFIT</strong></div>
        <span class="online-dot" title="Online"></span>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="pageEyebrow">PAINEL DO ALUNO</p>
          <h1 id="pageTitle">Olá, Mariana! 👋</h1>
        </div>
        <div class="top-actions">
          <button id="installTop" class="install-button hidden">Instalar no celular</button>
          <button class="icon-button" aria-label="Notificações">♢<span class="notification-badge"></span></button>
          <button class="profile-chip" data-route="profile"><span>MA</span><em>Mariana</em></button>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>

    <nav class="mobile-nav" aria-label="Navegação mobile">
      <button class="mobile-nav-item active" data-route="home"><span>⌂</span><small>Início</small></button>
      <button class="mobile-nav-item" data-route="workouts"><span>◫</span><small>Treinos</small></button>
      <button class="mobile-nav-item" data-route="diet"><span>♨</span><small>Dietas</small></button>
      <button class="mobile-nav-item" data-route="consulting"><span>◉</span><small>Consultoria</small></button>
      <button class="mobile-nav-item" data-route="profile"><span>◎</span><small>Perfil</small></button>
    </nav>
  </div>

  <div id="installBanner" class="install-banner hidden" role="dialog" aria-label="Instalar AFIT">
    <img src="assets/icons/icon-192.png" alt="" />
    <div><strong>Leve a AFIT com você</strong><small>Instale no celular e abra como um aplicativo.</small></div>
    <button id="installBannerButton">Instalar</button>
    <button id="dismissInstall" class="dismiss" aria-label="Fechar">×</button>
  </div>

  <div id="iosModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="iosTitle">
    <div class="modal-card">
      <button class="modal-close" id="closeIosModal">×</button>
      <div class="modal-icon">↥</div>
      <h2 id="iosTitle">Instalar no iPhone</h2>
      <p>Abra esta página no Safari, toque em <strong>Compartilhar</strong> e depois em <strong>Adicionar à Tela de Início</strong>.</p>
      <button class="primary-button" id="understoodIos">Entendi</button>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
